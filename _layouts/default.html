<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }}</title>

    {% include meta.html %}

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
  </head>

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="site-title" href="{{ site.baseurl }}/">{{ site.name }}</a>
        <nav aria-label="Primary navigation">
          <a href="{{ site.baseurl }}/">About</a>
          <a href="{{ site.baseurl }}/blogs">Blogs</a>
          <a href="{{ site.baseurl }}/nihar_dwivedi_resume.pdf">Resume</a>
        </nav>
      </div>
    </header>

    <main id="main" role="main" class="container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-links">
        <a href="https://github.com/nihardwivedi">GitHub</a>
        <a href="https://www.linkedin.com/in/nihardwivedi/">LinkedIn</a>
        <a href="mailto:ndwivedi@bu.edu">Email</a>
      </div>
    </footer>

    {% include analytics.html %}
  </body>
</html>
